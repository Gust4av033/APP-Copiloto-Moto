name: Android candidate
on:
  pull_request:
  push:
    branches: [main, feature/ui-storm-refined, release/play-internal-rc1]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x gradlew
      - name: Tests, lint, manifests and unsigned release
        run: ./gradlew testFullDebugUnitTest testPlaystoreDebugUnitTest testPlaystoreReleaseUnitTest lintFullDebug lintPlaystoreRelease bundlePlaystoreRelease processFullReleaseMainManifest --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-candidate-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/bundle/playstoreRelease/
          retention-days: 14
